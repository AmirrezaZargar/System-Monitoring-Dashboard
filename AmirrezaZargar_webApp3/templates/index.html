<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Monitor</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: {{ background_color }};
        margin: 0;
        padding: 30px;
        color: #222;
      }

      .box {
        max-width: 500px;
        margin: auto;
        background: #fff;
        padding: 25px;
        border-radius: 12px;
      }

      h1 {
        margin: 0 0 10px;
        text-align: center;
      }

      .sub,
      .time,
      .footer {
        text-align: center;
        color: #666;
        font-size: 14px;
        margin-bottom: 20px;
      }

      .item {
        margin-bottom: 20px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
      }

      .bar {
        height: 12px;
        background: #ddd;
        border-radius: 6px;
        overflow: hidden;
      }

      .fill {
        height: 100%;
        background: {{ background_color }};
      }

      .links {
        margin-top: 20px;
      }

      .links a {
        display: inline-block;
        margin-right: 10px;
        text-decoration: none;
        color: {{ background_color }};
      }

      button {
        width: 100%;
        margin-top: 20px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: {{ background_color }};
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>{{ message }}</h1>
      <div class="sub">System Monitor - {{ developer }}</div>

      <div class="time">{{ current_datetime }}</div>

      <div class="item">
        <div class="row">
          <span>CPU Usage</span>
          <span>{{ cpu_usage }}%</span>
        </div>
        <div class="bar">
          <div class="fill" style="width: {{ cpu_usage }}%;"></div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <span>RAM Usage</span>
          <span
            >{{ ram_usage }}% ({{ ram_used_gb }} / {{ ram_total_gb }} GB)</span
          >
        </div>
        <div class="bar">
          <div class="fill" style="width: {{ ram_usage }}%;"></div>
        </div>
      </div>

      <div class="links">
        <a href="/health">/health</a>
        <a href="/metrics">/metrics</a>
      </div>

      <button onclick="window.location.reload()">Refresh</button>
    </div>

    <div class="footer">Built with Flask - {{ developer }}</div>
  </body>
</html>
