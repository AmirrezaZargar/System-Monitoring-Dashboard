services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      BACKGROUND_COLORS: "#6C63FF,#3ECFCF,#FF6584,#43B97F,#F7B731"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
